<!-- ----------------------------------------------------------------------- -->
<!--                     Doraemon made with HTML and CSS                     -->
<!-- ----------------------------------------------------------------------- -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Doraemon Using HTML and CSS</title>
    <meta name="author" content="Kamal Kumar Doharey" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="" type="image/x-icon" />
    <!-- Optional: Add a favicon -->
    <meta
      name="description"
      content="A webpage dedicated to Doraemon using HTML and CSS."
    />
    <!-- Optional: Add a description for SEO -->
  </head>

  <body>
    <div class="doraemon-container">
      <!-- --------------------------- Body start here --------------------------- -->
      <div class="doraemon-face">
        <div class="face-left-eye">
          <div class="cl-detail"></div>
        </div>
        <div class="face-right-eye">
          <div class="cr-detail"></div>
        </div>
        <div class="doraemon-nose"></div>
        <div class="doraemon-mouth">
          <div class="tongue"></div>
        </div>
      </div>
      <!-- #TODO: Add A Bell TO Neck Of Doraemon -->
      <!-- #TODO: Fix face -->

      <!-- ----------------------------------------------------------------------- -->
      <div class="body-shoulder">
        <div class="tie-cloth">
          <div class="tie-knot"></div>
        </div>
      </div>
      <!-- ----------------------------------------------------------------------- -->
      <div class="body-stomach">
        <div class="hand-left">
          <div class="hand-left-palm"></div>
        </div>
        <div class="hand-right">
          <div class="hand-right-palm"></div>
        </div>
        <div class="white-pocket"></div>
      </div>
      <!-- ----------------------------------------------------------------------- -->
      <div class="body-bottom">
        <div class="leg-left">
          <div class="foot-left"></div>
        </div>
        <div class="leg-right">
          <div class="foot-right"></div>
        </div>
      </div>
      <!-- --------------------------- Body ends here ---------------------------- -->
    </div>
  </body>
  <!-- ------------------------------ linked js ------------------------------ -->
  <script src="JS/index.js"></script>
  <!-- ----------------------------------------------------------------------- -->
</html>
